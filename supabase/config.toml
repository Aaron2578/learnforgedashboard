
[auth]
additional_redirect_urls = ["https://tmdashboard-two.vercel.app"]
site_url = "https://tmdashboard-two.vercel.app"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
